
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>AIS QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
  * { box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    background: #f3f5f8;
    margin: 0;
    padding: 16px;
    text-align: center;
  }

  main {
    max-width: 480px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 14px;
  }

  input, button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    margin: 6px 0;
    border-radius: 8px;
  }

  input { border: 1px solid #ccc; }

  button {
    background: #1769aa;
    color: white;
    border: none;
  }

  #reader { margin-top: 15px; }

  #status {
    margin: 15px 0;
    padding: 15px;
    background: #eee;
    border-radius: 8px;
    overflow-wrap: anywhere;
  }

  .sent { background: #fff0bd !important; }
  .error { background: #ffd6d6 !important; }

  #count {
    font-size: 30px;
    font-weight: bold;
  }

  #last {
    font-family: monospace;
    font-size: 24px;
    overflow-wrap: anywhere;
  }

  #history {
    text-align: left;
    font-family: monospace;
    overflow-wrap: anywhere;
  }

  #history div {
    padding: 8px;
    border-bottom: 1px solid #ddd;
  }
</style>
</head>

<body>
<main>
  <h2>AIS QR Scanner — V3</h2>

  <div id="settings">
    <input id="url" placeholder="Apps Script /exec URL">
    <input id="key" type="password"
           placeholder="Scanner key">
    <button onclick="startCamera()">Start Camera</button>
  </div>

  <div id="reader"></div>

  <div id="status">Ready to start</div>

  <div id="count">0 submitted</div>

  <p>Last QR code:</p>
  <div id="last">—</div>

  <h3>Scans sent this session</h3>
  <div id="history"></div>

  <!-- Hidden target for Google Apps Script POSTs -->
  <iframe name="scanReceiver"
          id="scanReceiver"
          style="display:none"></iframe>
</main>

<script>
let scanner;
let endpoint = '';
let scannerKey = '';
let count = 0;
let busy = false;

// Prevent the same code being submitted repeatedly.
// For this test, one submission per distinct QR code.
const submitted = new Set();

function status(message, css = '') {
  const el = document.getElementById('status');
  el.textContent = message;
  el.className = css;
}

async function startCamera() {
  endpoint = document.getElementById('url').value.trim();
  scannerKey = document.getElementById('key').value.trim();

  if (!endpoint.startsWith('https://') ||
      !scannerKey) {
    status('Enter Web App URL and scanner key', 'error');
    return;
  }

  if (!endpoint.endsWith('/exec')) {
    status('Use the deployed /exec URL', 'error');
    return;
  }

  try {
    scanner = new Html5Qrcode('reader');

    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: { width: 240, height: 240 }
      },
      onScan,
      () => {}
    );

    document.getElementById('settings').hidden = true;
    status('Camera ready — scan a QR code');

  } catch (err) {
    status('Camera error: ' + err, 'error');
  }
}

function onScan(decodedText) {
  if (busy) return;

  const code = String(decodedText).trim();

  if (!/^[0-9]{1,100}$/.test(code)) {
    status('QR must contain digits only', 'error');
    return;
  }

  if (submitted.has(code)) return;

  busy = true;

  try {
    submitCode(code);
    submitted.add(code);

    count++;
    document.getElementById('count').textContent =
      count + ' submitted';

    document.getElementById('last').textContent = code;

    const item = document.createElement('div');
    item.textContent = new Date().toLocaleTimeString() +
      ' — ' + code;

    document.getElementById('history').prepend(item);

    status('Submitted: ' + code +
           ' — verify in Google Sheets', 'sent');

    if (navigator.vibrate) {
      navigator.vibrate(120);
    }

  } catch (err) {
    status('Submission error: ' + err.message, 'error');

  } finally {
    setTimeout(() => { busy = false; }, 1200);
  }
}

function submitCode(code) {
  const form = document.createElement('form');

  form.method = 'POST';
  form.action = endpoint;
  form.target = 'scanReceiver';
  form.style.display = 'none';

  const fields = {
    code: code,
    key: scannerKey
  };

  Object.entries(fields).forEach(([name, value]) => {
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = name;
    input.value = value;
    form.appendChild(input);
  });

  document.body.appendChild(form);
  form.submit();
  form.remove();
}
</script>
</body>
</html>
